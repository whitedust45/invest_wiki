        dailySnapshotId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        asOfDate: {type: string, format: date}
        netAssetBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: 同一请求、同一原币种历史序列内的相对高度；小程序不得用金额自行重算。
    PortfolioAllocation:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PortfolioAllocationCurrency'}
    PortfolioAllocationCurrency:
      type: object
      required: [currency, valuationStatus, marketValueCent, slices]
      properties:
        currency: {type: string, enum: [CNY, USD]}
        valuationStatus: {type: string}
        marketValueCent:
          type: [string, 'null']
          pattern: '^(?:0|[1-9][0-9]*)$'
        slices:
          type: array
          items: {$ref: '#/components/schemas/PortfolioAllocationSlice'}
    PortfolioAllocationSlice:
      type: object
      required: [instrumentId, marketValueCent, shareBasisPoints]
      properties:
        instrumentId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        marketValueCent: {type: string, pattern: '^(?:0|[1-9][0-9]*)$'}
        shareBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
          description: 服务端计算的单币种渲染比例，不是货币金额。
    PortfolioCurrencyOverview:
      type: object
      required: [currency, cashCent, marginCent, positions, asOf, sourceLedgerVersion, valuationStatus]
      properties:
        currency:
          type: string
          enum: [CNY, USD]
        cashCent:
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)$'
        marginCent:
          type: string
          pattern: '^-?(?:0|[1-9][0-9]*)$'
        marketValueCent:
          type: [string, 'null']
          description: 全部未平仓持仓可估值时的原币种总市值；账户视图遇用户级总市值时为 null。
          pattern: '^(?:0|[1-9][0-9]*)$'
        netAssetCent:
          type: [string, 'null']
          description: cashCent + marginCent + marketValueCent；估值不完整时为 null。
          pattern: '^-?(?:0|[1-9][0-9]*)$'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioPosition'
        asOf:
          type: string
          format: date
        sourceLedgerVersion:
          type: string
          pattern: '^[0-9]+$'
        valuationStatus:
          type: string
          enum: [NO_OPEN_POSITION, MANUAL, MANUAL_TOTAL_UNALLOCATED, PARTIALLY_UNVALUED, UNVALUED]
    PortfolioPosition:
      type: object
      required: [cashAccountId, instrumentId, currency, quantity, valuationStatus]
      properties:
        cashAccountId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        instrumentId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        currency:
          type: string
          enum: [CNY, USD]
        quantity:
          type: string
          pattern: '^[1-9][0-9]*(?:\\.[0-9]{1,8})?$'
        marketValueCent:
          type: [string, 'null']
          pattern: '^(?:0|[1-9][0-9]*)$'
        costCent:
          type: [string, 'null']
          description: FIFO 剩余成本；期货和无法从不可变批次精确恢复成本的持仓为 null。
          pattern: '^(?:0|[1-9][0-9]*)$'
        unrealizedPnlCent:
          type: [string, 'null']
          description: 仅当单位价估值和 FIFO 剩余成本均可精确表达时返回 marketValueCent - costCent；不对用户级总市值或期货计算。
          pattern: '^-?(?:0|[1-9][0-9]*)$'
        valuationStatus:
          type: string
          enum: [MANUAL_UNIT_PRICE, MANUAL_TOTAL_UNALLOCATED, UNVALUED, EXPIRED, PRECISION_UNAVAILABLE,
                 FUTURES_SETTLEMENT_ONLY]
    ManualValuationCreate:
      type: object
      required: [instrumentId, valuationDate, currency]
      properties:
        instrumentId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        valuationDate:
          type: string
          format: date
        currency:
          type: string
          enum: [CNY, USD]
        unitPriceCent:
          type: [string, 'null']
          description: 原币种最小单位单价；与 marketValueCent 二选一。
          pattern: '^[1-9][0-9]*$'
        marketValueCent:
          type: [string, 'null']
          description: “用户 + 标的”的原币种最小单位总市值，只在组合总览中计一次；与 unitPriceCent 二选一。
          pattern: '^[1-9][0-9]*$'
        validUntil:
          type: [string, 'null']
          format: date-time
        note:
          type: [string, 'null']
          maxLength: 1000
    ManualValuation:
      allOf:
        - $ref: '#/components/schemas/ManualValuationCreate'
        - type: object
          required: [manualValuationId, priority, valuationStatus]
          properties:
            manualValuationId:
              type: string
              pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
            priority:
              type: integer
              enum: [100]
            valuationStatus:
              type: string
              enum: [ACTIVE, EXPIRED]
    ReconciliationCreate:
      type: object
      required: [cashAccountId, reconciliationDate, brokerCashCent, positions]
      properties:
        cashAccountId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        reconciliationDate:
          type: string
          format: date
        brokerCashCent:
          type: string
          pattern: '^(?:0|[1-9][0-9]*)$'
        positions:
          type: array
          description: 券商在该账户/日期的全部非零持仓快照；不得含重复标的。
          items:
            $ref: '#/components/schemas/ReconciliationBrokerPosition'
        attachmentImportExportFileId:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        discrepancyReason:
          type: [string, 'null']
          maxLength: 1000
    ReconciliationBrokerPosition:
      type: object
      required: [instrumentId, quantity]
      properties:
        instrumentId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        quantity:
          type: string
          pattern: '^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,8})?$'
    Reconciliation:
      type: object
      required: [reconciliationId, cashAccountId, reconciliationDate, brokerCashCent, ledgerCashCent,
                 cashDifferenceCent, cashDifferenceDirection, currency, status, sourceLedgerVersion, positions]
      properties:
        reconciliationId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        cashAccountId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        reconciliationDate:
          type: string
          format: date
        brokerCashCent:
          type: string
          pattern: '^(?:0|[1-9][0-9]*)$'
        ledgerCashCent:
          type: string
          pattern: '^(?:0|[1-9][0-9]*)$'
        cashDifferenceCent:
          type: string
          pattern: '^(?:0|[1-9][0-9]*)$'
        cashDifferenceDirection:
          type: string
          enum: [NONE, BROKER_GREATER, LEDGER_GREATER]
        currency:
          type: string
          enum: [CNY, USD]
        status:
          type: string
          enum: [MATCHED, NEEDS_REVIEW]
        sourceLedgerVersion:
          type: integer
          minimum: 0
        positions:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationPosition'
    ReconciliationPosition:
      type: object
      required: [instrumentId, brokerQuantity, ledgerQuantity, quantityDifference]
      properties:
        instrumentId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        brokerQuantity:
          type: string
        ledgerQuantity:
          type: string
        quantityDifference:
          type: string
    ReconciliationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reconciliation'
        nextCursor:
          type: [string, 'null']
    SpotTransactionCreate:
      type: object
      required: [transactionType, occurredOn, cashAccountId, instrumentId, quantity, unitPriceCent]
      properties:
        transactionType:
          type: string
          enum: [TRADE_BUY, TRADE_SELL]
        occurredOn:
          type: string
          format: date
        note:
          type: [string, 'null']
          maxLength: 1000
        cashAccountId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        instrumentId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        quantity:
          type: string
          pattern: '^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,8})?$'
        unitPriceCent:
          type: string
          pattern: '^[1-9][0-9]*$'
        feeCent:
          type: string
          pattern: '^(?:0|[1-9][0-9]*)$'
    LedgerTransactionCreate:
      type: object
      required: [transactionType, occurredOn]
      properties:
        transactionType:
          type: string
          enum: [EXTERNAL_FUNDING, EXTERNAL_WITHDRAWAL, INTERNAL_TRANSFER, FEE, TRADE_BUY, TRADE_SELL, DIVIDEND, INTEREST, CORPORATE_ACTION, FUTURES_MARGIN, FUTURES_OPEN, FUTURES_CLOSE, FUTURES_DAILY_SETTLEMENT, FUTURES_ROLL, OPTION_OPEN, OPTION_CLOSE, OPTION_EXPIRE]
        occurredOn:
          type: string
          format: date
        note:
          type: [string, 'null']
          maxLength: 1000
        cashAccountId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        destinationAccountId:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        instrumentId:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        quantity:
          type: [string, 'null']
          pattern: '^[1-9][0-9]*(?:\\.[0-9]{1,8})?$'
        unitPriceCent:
          type: [string, 'null']
          pattern: '^[1-9][0-9]*$'
        pricePoints:
          type: [string, 'null']
          description: 期货成交点位；仅 FUTURES_OPEN、FUTURES_CLOSE 使用，最多 8 位小数。
          pattern: '^[1-9][0-9]*(?:\\.[0-9]{1,8})?$'
        settlementPricePoints:
          type: [string, 'null']
          description: 期货逐日结算点位；仅 FUTURES_DAILY_SETTLEMENT 使用，最多 8 位小数。
          pattern: '^[1-9][0-9]*(?:\\.[0-9]{1,8})?$'
        initialMarginCent:
          type: [string, 'null']
          description: 期货初始保证金，以人民币最小单位存储；仅 FUTURES_OPEN 使用。
          pattern: '^[1-9][0-9]*$'
        feeCent:
          type: [string, 'null']
          pattern: '^(?:0|[1-9][0-9]*)$'
        amountCent:
          type: [string, 'null']
          pattern: '^[1-9][0-9]*$'
        taxWithheldCent:
          type: [string, 'null']
          pattern: '^(?:0|[1-9][0-9]*)$'
        entitlementDate:
          type: [string, 'null']
          format: date
        perShareAmountCent:
          type: [string, 'null']
          pattern: '^[1-9][0-9]*$'
        corporateAction:
          type: [object, 'null']
          required: [actionType, instrumentId, ratioNumerator, ratioDenominator]
          properties:
            actionType:
              type: string
              enum: [STOCK_SPLIT, REVERSE_SPLIT, STOCK_DIVIDEND]
            instrumentId:
              type: string
              pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
            ratioNumerator:
              type: string
              pattern: '^[1-9][0-9]*$'
            ratioDenominator:
              type: string
              pattern: '^[1-9][0-9]*$'
        marginDirection:
          type: [string, 'null']
          enum: [IN, OUT, null]
        expiryOutcome:
          type: [string, 'null']
          description: 期权到期核销的人工确认；仅 OPTION_EXPIRE 使用。
          enum: [WORTHLESS, null]
        strategyKey:
          type: [string, 'null']
          description: 从策略工作区提交时必填，作为不可变账本归属；通用账本交易可为 null。
          enum: [HIGH_DIVIDEND, QQQ_GROWTH, IC_IM, DEEP_PUT, null]
        futuresRoll:
          type: [object, 'null']
          description: 仅 FUTURES_ROLL 使用；closeLeg 和 openLeg 将在同一事务中写入。
          required: [closeLeg, openLeg]
          properties:
            closeLeg:
              $ref: '#/components/schemas/FuturesRollLeg'
            openLeg:
              $ref: '#/components/schemas/FuturesRollLeg'
    FuturesRollLeg:
      type: object
      required: [cashAccountId, instrumentId, quantity, pricePoints]
      properties:
        cashAccountId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        instrumentId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        quantity:
          type: string
          pattern: '^[1-9][0-9]*$'
        pricePoints:
          type: string
          pattern: '^[1-9][0-9]*(?:\.[0-9]{1,8})?$'
        initialMarginCent:
          type: [string, 'null']
          description: openLeg 必填、closeLeg 禁止；以 CNY 最小单位表示。
          pattern: '^[1-9][0-9]*$'
        feeCent:
          type: [string, 'null']
          pattern: '^(?:0|[1-9][0-9]*)$'
    FuturesRollResponse:
      type: object
      required: [operationGroupKey, transactions]
      properties:
        operationGroupKey:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        transactions:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/LedgerTransaction'
    LedgerTransaction:
      type: object
      required: [transactionId, transactionType, occurredOn, currency, postings, tradeDetails, ledgerVersion]
      properties:
        transactionId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        transactionType:
          type: string
          enum: [EXTERNAL_FUNDING, EXTERNAL_WITHDRAWAL, INTERNAL_TRANSFER, FEE, TRADE_BUY, TRADE_SELL, DIVIDEND, INTEREST, CORPORATE_ACTION, FUTURES_MARGIN, FUTURES_OPEN, FUTURES_CLOSE, FUTURES_DAILY_SETTLEMENT, OPTION_OPEN, OPTION_CLOSE, OPTION_EXPIRE, REVERSAL]
        occurredOn:
          type: string
          format: date
        currency:
          type: [string, 'null']
          enum: [CNY, USD, null]
        postings:
          type: array
          items:
            $ref: '#/components/schemas/LedgerPosting'
        tradeDetails:
          type: array
          items:
            $ref: '#/components/schemas/TradeDetail'
        ledgerVersion:
          type: string
          pattern: '^[1-9][0-9]*$'
    LedgerTransactionDetail:
      type: object
      required: [transactionId, transactionType, occurredOn, sourceType, correctionRootTransactionId, revisionNo,
                 ledgerVersion, correctable, postings, tradeDetails]
      properties:
        transactionId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        transactionType:
          type: string
          enum: [EXTERNAL_FUNDING, EXTERNAL_WITHDRAWAL, INTERNAL_TRANSFER, FEE, TRADE_BUY, TRADE_SELL, DIVIDEND,
                 INTEREST, CORPORATE_ACTION, FUTURES_MARGIN, FUTURES_OPEN, FUTURES_CLOSE,
                 FUTURES_DAILY_SETTLEMENT, OPTION_OPEN, OPTION_CLOSE, OPTION_EXPIRE, REVERSAL]
        occurredOn: {type: string, format: date}
        strategyKey:
          type: [string, 'null']
          enum: [HIGH_DIVIDEND, QQQ_GROWTH, IC_IM, DEEP_PUT, null]
        operationGroupKey:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        sourceType:
          type: string
          enum: [MANUAL, IMPORT, CORRECTION_REVERSAL, CORRECTION_REPLACEMENT]
        importExportFileId:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        correctionRootTransactionId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        reversalOfTransactionId:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        revisionNo: {type: integer, minimum: 0}
        ledgerVersion: {type: string, pattern: '^[1-9][0-9]*$'}
        note: {type: [string, 'null'], maxLength: 1000}
        correctable: {type: boolean}
        postings:
          type: array
          items: {$ref: '#/components/schemas/LedgerTransactionDetailPosting'}
        tradeDetails:
          type: array
          items: {$ref: '#/components/schemas/LedgerTransactionDetailTrade'}
        corporateAction:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/LedgerCorporateActionDetail'
        income:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/LedgerIncomeDetail'
    LedgerTransactionDetailPosting:
      type: object
      required: [postingId, accountId, postingNo, postingSide, amountCent, currency]
      properties:
        postingId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        accountId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        postingNo: {type: integer, minimum: 1}
        postingSide: {type: string, enum: [DEBIT, CREDIT]}
        amountCent: {type: string, pattern: '^[1-9][0-9]*$'}
        currency: {type: string, enum: [CNY, USD]}
    LedgerTransactionDetailTrade:
      type: object
      required: [tradeDetailId, detailNo, instrumentId, positionEffect, quantity, feeCent]
      properties:
        tradeDetailId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        detailNo: {type: integer, minimum: 1}
        instrumentId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        positionEffect: {type: string, enum: [OPEN, CLOSE, NONE]}
        quantity: {type: string}
        unitPriceCent: {type: [string, 'null'], pattern: '^[1-9][0-9]*$'}
        pricePoints: {type: [string, 'null']}
        contractMultiplierCent: {type: [string, 'null'], pattern: '^[1-9][0-9]*$'}
        deliveryDate: {type: [string, 'null'], format: date}
        feeCent: {type: string, pattern: '^(?:0|[1-9][0-9]*)$'}
        optionContractMultiplier: {type: [string, 'null'], pattern: '^[1-9][0-9]*$'}
    LedgerCorporateActionDetail:
      type: object
      required: [corporateActionId, instrumentId, actionType, effectiveOn, ratioNumerator, ratioDenominator]
      properties:
        corporateActionId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        instrumentId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        actionType: {type: string, enum: [STOCK_SPLIT, REVERSE_SPLIT, STOCK_DIVIDEND]}
        effectiveOn: {type: string, format: date}
        ratioNumerator: {type: string, pattern: '^[1-9][0-9]*$'}
        ratioDenominator: {type: string, pattern: '^[1-9][0-9]*$'}
    LedgerIncomeDetail:
      type: object
      required: [incomeDetailId, incomeType, grossAmountCent, taxWithheldCent, currency]
      properties:
        incomeDetailId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        incomeType: {type: string, enum: [DIVIDEND, INTEREST]}
        instrumentId: {type: [string, 'null'], pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        entitlementDate: {type: [string, 'null'], format: date}
        grossAmountCent: {type: string, pattern: '^[1-9][0-9]*$'}
        taxWithheldCent: {type: string, pattern: '^(?:0|[1-9][0-9]*)$'}
        perShareAmountCent: {type: [string, 'null'], pattern: '^[1-9][0-9]*$'}
        currency: {type: string, enum: [CNY, USD]}
    LedgerSnapshot:
      type: object
      required: [ledgerSnapshotId, asOfDate, sourceLedgerVersion, contentSha256Hex, createdAt]
      properties:
        ledgerSnapshotId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        asOfDate: {type: string, format: date}
        sourceLedgerVersion: {type: string, pattern: '^[1-9][0-9]*$'}
        contentSha256Hex: {type: string, pattern: '^[a-f0-9]{64}$'}
        createdAt: {type: string, format: date-time}
    LedgerSnapshotListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LedgerSnapshot'}
    LedgerSnapshotRestoreResponse:
      type: object
      required: [ledgerSnapshotId, restoredAccountCount, restoredTransactionCount, targetLedgerVersion]
      properties:
        ledgerSnapshotId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        restoredAccountCount: {type: integer, minimum: 1}
