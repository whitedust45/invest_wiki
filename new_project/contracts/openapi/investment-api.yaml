      type: object
      required: [dailySnapshotId, currency, asOfDate, netAssetCent, cashCent, marketValueCent,
                 sourceLedgerVersion, calculatedAt]
      properties:
        dailySnapshotId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        currency: {type: string, enum: [CNY, USD]}
        asOfDate: {type: string, format: date}
        netAssetCent: {type: string, pattern: '^[0-9]+$'}
        cashCent: {type: string, pattern: '^[0-9]+$'}
        marketValueCent: {type: string, pattern: '^[0-9]+$'}
        sourceLedgerVersion: {type: string, pattern: '^[0-9]+$'}
        calculatedAt: {type: string, format: date-time}
