openapi: 3.1.0
info:
  title: Personal Investment API
  version: 0.2.0
  description: 本地开发切片。所有金额以原币种两位小数最小单位的十进制字符串传输，绝不使用浮点数。
servers:
  - url: http://127.0.0.1:<API_PORT>
paths:
  /api/v1/auth/wechat/login:
    post:
      summary: local Mock 微信登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/me:
    get:
      summary: 当前登录管理员
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/ledger/accounts:
    get:
      summary: 查询当前管理员的现金账户
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 现金账户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashAccountListResponse'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      summary: 创建现金账户并初始化同币种后端系统科目
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCashAccountRequest'
      responses:
        '201':
          description: 已创建；同键同请求返回首个响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashAccount'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/market/instruments:
    get:
      summary: 分页查询全局行情标的和显式 Tushare 代码映射
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
      responses:
        '200':
          description: 稳定游标页
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstrumentPage'}
    post:
      summary: 创建或复用全局标的主数据
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstrumentRequest'
      responses:
        '201':
          description: 已创建；同自然键同定义或同幂等键返回首个响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/market/instruments/{instrumentId}/source-codes/TUSHARE_PRO:
    put:
      summary: 维护标的的显式 Tushare Pro 代码
      security:
        - bearerAuth: []
      parameters:
        - name: instrumentId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TushareCodeRequest'}
      responses:
        '200':
          description: 代码已更新
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instrument'}
  /api/v1/market/snapshot-submissions:
    post:
      summary: 提交经核验的市场快照；仅入队，不在请求线程调用外部数据源
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MarketSnapshotSubmissionRequest'}
      responses:
        '202':
          description: 已持久化并等待后台处理
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketSnapshotSubmissionAccepted'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/market/sync-runs/{marketSyncRunId}:
    get:
      summary: 查询行情同步运行状态
      security:
        - bearerAuth: []
      parameters:
        - name: marketSyncRunId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
      responses:
        '200':
          description: 可审计运行状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketSyncRun'}
  /api/v1/market/overview:
    get:
      summary: 查询当前行情工作台
      description: 返回最近一次行情运行的报价、指标、IC/IM 贴水、来源尝试和降级事件。所有价格保留原币种最小单位；没有运行时返回显式空工作台。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 可审计的行情工作台读模型
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketOverview'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/files/upload-requests:
    post:
      summary: 申请私有导入或对账证据的单对象预签名 POST 上传凭据
      description: 服务端生成 owner 隔离的 quarantine object key。上传凭据有效期、大小、媒体类型、SHA-256 元数据和服务端加密算法均由服务端固定；上传成功不代表文件已通过扫描或可被导入。
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: 已签发一次单文件 POST 表单；客户端必须原样提交 formData 与 fileField。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRequestResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/files/{importExportFileId}/scan-requests:
    post:
      summary: 通知服务端已完成预签名 POST 上传并申请隔离扫描
      description: 客户端通知不被信任。服务端仅将本 owner 的 UPLOAD_PENDING 文件排入隔离扫描队列；worker 必须重新读取并验证对象的大小、MIME、hash、owner/file 元数据和内容安全，成功前不可导入或作为对账证据。
      security:
        - bearerAuth: []
      parameters:
        - name: importExportFileId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '202':
          description: 文件已进入隔离扫描队列；此响应不代表扫描成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileScanRequestResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/files/{importExportFileId}:
    get:
      summary: 查询当前管理员上传文件的安全状态
      description: 仅返回 owner 隔离的状态元数据，不返回对象键、哈希、上传 URL、表单或加密信息。
      security:
        - bearerAuth: []
      parameters:
        - name: importExportFileId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      responses:
        '200':
          description: 当前文件状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileStatusResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/ledger/imports:
    post:
      summary: 创建历史账本 dry-run 导入作业
      description: 仅接受已扫描的私有 IMPORT 文件。服务端使用映射生成不可变预览；不会在此步骤写入账本。重提同一文件会使其未确认旧预览失效。
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyImportRequest'
      responses:
        '202':
          description: 已创建可轮询的本地 dry-run 作业。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyImportJob'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/jobs/{jobId}:
    get:
      summary: 查询历史导入 dry-run 作业
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      responses:
        '200':
          description: 导入作业及逐行预览结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyImportJob'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/ledger/imports/{jobId}/confirm:
    post:
      summary: 以 checksum 确认历史导入并原子追加账本事实
      description: 仅 SUCCEEDED、未过期且 checksum 完全匹配的预览可确认。确认后所有事实 sourceType=IMPORT 且关联 importExportFileId；旧 Dashboard ic/roll 仅导入其费用并标记 ROLL_FEE_ONLY。
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyImportConfirm'
      responses:
        '200':
          description: 已原子确认。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyImportJob'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/portfolio/summary:
    get:
      summary: 查询按原币种分组的组合总览
      description: 不进行汇率换算或跨币种合并。用户级 marketValueCent 仅在此接口按“用户 + 标的”计入一次。
      security:
        - bearerAuth: []
      parameters:
        - name: asOf
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 按币种隔离、带账本版本的组合只读快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/portfolio/positions:
    get:
      summary: 查询单一原币种的持仓与估值状态
      description: accountId 可选；用户级总市值永不在该接口分摊到账户，结果明确标记 MANUAL_TOTAL_UNALLOCATED。
      security:
        - bearerAuth: []
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
            enum: [CNY, USD]
        - name: accountId
          in: query
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        - name: asOf
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 单币种、owner 隔离的持仓快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioCurrencyOverview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/reports/portfolio-history:
    get:
      summary: 查询按原币种隔离的组合净值历史
      description: 仅返回估值完整时追加的历史点；未估值日期不会以成本、零值或混币数值填充。
      security:
        - bearerAuth: []
      parameters:
        - name: currency
          in: query
          required: true
          schema: {type: string, enum: [CNY, USD]}
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 366}
      responses:
        '200':
          description: 按业务日与账本版本升序的不可变历史点
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortfolioHistory'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      summary: 手动重算并追加当日组合历史点
      description: 仅追加估值完整的同币种组合。相同 owner、币种、日期和账本版本幂等，不会覆盖历史。
      security:
        - bearerAuth: []
      parameters:
        - name: asOfDate
          in: query
          schema: {type: string, format: date}
      responses:
        '201':
          description: 快照计算完成；未估值币种会明确计入 skippedUnvaluedCurrencyCount。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortfolioHistorySnapshotWrite'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/reports/allocation:
    get:
      summary: 查询按原币种隔离的持仓资产分布
      description: 份额比例由服务端计算为渲染用 basis points；用户级总市值未分摊或估值不完整时不返回伪造分布。
      security:
        - bearerAuth: []
      parameters:
        - name: asOf
          in: query
          schema: {type: string, format: date}
      responses:
        '200':
          description: 单币种资产分布；每个条目的金额和份额均不跨币种。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortfolioAllocation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/portfolio/manual-valuations:
    post:
      summary: 追加手工估值事实
      description: 仅影响组合读模型，不修改账本分录、成本或持仓批次。仅支持股票、ETF、期权；币种必须等于标的原生币种，单价和用户级总市值二选一。
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualValuationCreate'
      responses:
        '201':
          description: 已追加不可变手工估值事实
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualValuation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/portfolio/reconciliations:
    get:
      summary: 查询当前管理员的手工对账历史
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: cashAccountId
          in: query
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 按对账日、账本版本、创建时间稳定倒序返回的 owner 隔离分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      summary: 追加手工券商对账事实
      description: 以指定业务日的账本现金与完整持仓快照和操作者录入的券商快照对比；任何差异均只标记 NEEDS_REVIEW，绝不自动调账。
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationCreate'
      responses:
        '201':
          description: 已追加不可变对账事实
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/ledger/accounts/{accountId}/disable:
    post:
      summary: 停用现金账户
      description: 仅余额为零、没有现货/期货持仓、保证金余额及活动导入引用时可停用；不删除历史事实。
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: '^"?[0-9]+"?$'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: 已停用并递增版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashAccount'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/ledger/transactions:
    get:
      summary: 按 owner 查询不可变账务流水
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: accountId
          in: query
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        - name: instrumentId
          in: query
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        - name: transactionType
          in: query
          description: 按不可变账务事实类型筛选。
          schema:
            type: string
            enum: [EXTERNAL_FUNDING, EXTERNAL_WITHDRAWAL, INTERNAL_TRANSFER, FEE, TRADE_BUY, TRADE_SELL, DIVIDEND, INTEREST, CORPORATE_ACTION, FUTURES_MARGIN, FUTURES_OPEN, FUTURES_CLOSE, FUTURES_DAILY_SETTLEMENT, OPTION_OPEN, OPTION_CLOSE, OPTION_EXPIRE, REVERSAL]
        - name: strategyKey
          in: query
          description: 按写入时的策略归属筛选。
          schema:
            type: string
            enum: [HIGH_DIVIDEND, QQQ_GROWTH, IC_IM, DEEP_PUT]
        - name: search
          in: query
          description: 按动作、备注、标的代码或标的名称检索；不会参与金额计算。
          schema:
            type: string
            maxLength: 128
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: owner 隔离、按业务日期和交易 ID 倒序的稳定游标页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransactionPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      summary: 创建资金、现货、公司行为或期货账务事实
      description: 当前实现接受 EXTERNAL_FUNDING、EXTERNAL_WITHDRAWAL、INTERNAL_TRANSFER、FEE、TRADE_BUY、TRADE_SELL、DIVIDEND、INTEREST、CORPORATE_ACTION、FUTURES_MARGIN、FUTURES_OPEN、FUTURES_CLOSE、FUTURES_DAILY_SETTLEMENT、FUTURES_ROLL、OPTION_OPEN、OPTION_CLOSE、OPTION_EXPIRE；金额和数量均为字符串。FUTURES_ROLL 是命令而非落库类型，会原子追加一条 FUTURES_CLOSE 和一条 FUTURES_OPEN，并返回 operationGroupKey。期货只允许 CFFEX 人民币 IC/IM 合约、整手数量；开仓须早于交割日，平仓和逐日结算不得晚于交割日。逐日结算必须使用独立的 settlementPricePoints，不接受成交数量、成交点位、手续费或保证金字段。期权仅支持多头开仓、平仓及到期日整仓无价值核销，不支持卖空、行权或指派。
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerTransactionCreate'
      responses:
        '201':
          description: 已追加不可变账务事实；FUTURES_ROLL 返回由两条事实组成的操作组
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LedgerTransaction'
                  - $ref: '#/components/schemas/FuturesRollResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/ledger/exports:
    get:
      summary: 生成 owner 隔离的账本导出文件
      description: 仅从不可变账本事实生成 JSON 审计副本或 CSV 流水。每次生成均写入审计日志；导出不能修改、删除、冲正或恢复任何事实。所有金额仍以原币种 *_cent 十进制字符串表示。
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [JSON, CSV]
      responses:
        '200':
          description: 仅对当前认证 owner 返回的附件流；响应头包含 export ID 与内容 SHA-256。
          content:
            application/json: {schema: {type: string, format: binary}}
            text/csv: {schema: {type: string, format: binary}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/ledger/snapshots:
    get:
      summary: 列出当前 owner 的加密账本快照元数据
      description: 返回只读元数据和内容 SHA-256；快照正文必须通过 owner 认证下载，永不暴露对象存储地址。
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerSnapshotListResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      summary: 为当前不可变账本生成或复用当日版本快照
      description: 快照正文以服务端加密对象保存，元数据及生成操作写入审计日志。空账本不能创建快照。
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '201':
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerSnapshot'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/ledger/snapshots/{ledgerSnapshotId}/download:
    get:
      summary: 下载已校验的 owner 快照 JSON
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerSnapshotId'
      responses:
        '200':
          description: 附件流；响应头包含 snapshot ID 与 SHA-256。
          content:
            application/json: {schema: {type: string, format: binary}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/ledger/snapshots/{ledgerSnapshotId}/restore:
    post:
      summary: 在空账本工作区原子恢复快照
      description: 服务端先锁住 owner 的账本状态，再确认没有任何账户或账务事实。只会以新的 IMPORT 事实追加恢复；已有账本一律拒绝，不存在覆盖、删除或回滚接口。恢复前必须验证快照 SHA-256 与所有引用标的的主数据。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LedgerSnapshotId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '201':
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerSnapshotRestoreResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/ledger/transactions/preview:
    post:
      summary: 预览资金、现货、公司行为或期货账务事实
      description: 只校验和计算，不创建账户、账务事实、流水或持仓投影；支持的类型与交易创建端点一致。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerTransactionCreate'
      responses:
        '200':
          description: 预览成功，客户端确认后才可向交易创建端点提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotTransactionPreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/ledger/transactions/{transactionId}:
    get:
      summary: 读取不可变账务事实的审计明细
      description: 返回原始分录、交易明细、公司行为和更正链元数据；不提供物理编辑或删除能力。
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      responses:
        '200':
          description: owner 隔离的账务审计视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransactionDetail'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/ledger/transactions/{transactionId}/corrections:
    post:
      summary: 原子追加镜像冲正与可选替代交易
      description: 冲正保留原始业务日期；存在 replacement 时，以同一更正根、连续修订号和连续账本版本在同一个事务中追加正常业务事实。
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '201':
          description: 已追加镜像冲正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/strategies:
    get:
      summary: 读取四个策略工作区摘要
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 即使账本为空仍返回四张策略卡片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyListResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/development/strategy-test-seed:
    post:
      summary: 写入 local 环境的完整策略测试种子
      description: 仅当 Spring profile 为 local 时路由存在。仅允许当前管理员的账本为空；所有账本事实均通过正常命令追加，不能用于生产或体验环境。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyTestSeedRequest'
      responses:
        '201':
          description: 已写入一次完整 local 策略测试路径。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyTestSeedResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/strategies/scans:
    post:
      summary: 异步扫描已存策略输入
      description: 仅读取已落库的账本、市场快照和参考净值，不触发外部行情请求或交易。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyScanRequest'
      responses:
        '202':
          description: 策略扫描已持久化入队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyScan'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/strategies/scans/{strategyScanId}:
    get:
      summary: 查询策略扫描及逐策略结果
      security:
        - bearerAuth: []
      parameters:
        - name: strategyScanId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      responses:
        '200':
          description: 扫描状态及已追加的逐策略结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyScan'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/strategies/{strategyKey}/workspace:
    get:
      summary: 读取一个策略工作区及可用账务动作
      security:
        - bearerAuth: []
      parameters:
        - name: strategyKey
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StrategyKey'
      responses:
        '200':
          description: 当前策略工作区摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyWorkspaceResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/strategies/{strategyKey}/rule-versions:
    get:
      summary: 分页读取策略规则版本历史
      security:
        - bearerAuth: []
      parameters:
        - name: strategyKey
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StrategyKey'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: 按创建时间和业务 ID 倒序的稳定游标页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleVersionPage'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      summary: 追加并激活一个策略规则版本
      security:
        - bearerAuth: []
      parameters:
        - name: strategyKey
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StrategyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyRuleVersionCreate'
      responses:
        '201':
          description: 新版本已成为唯一活动规则，旧活动版本已归档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyRuleVersionCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/strategies/{strategyKey}/reference-nav:
    get:
      summary: 分页读取 USD 策略参考净值事实
      security:
        - bearerAuth: []
      parameters:
        - name: strategyKey
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StrategyKey'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: 按创建时间和业务 ID 倒序的稳定游标页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceNavPage'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      summary: 追加用户明确维护的 USD 策略参考净值
      security:
        - bearerAuth: []
      parameters:
        - name: strategyKey
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StrategyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceNavCreate'
      responses:
        '201':
          description: 已追加参考净值事实
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceNav'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/strategies/{strategyKey}/evaluations:
    get:
      summary: 分页读取不可变策略评估快照
      security:
        - bearerAuth: []
      parameters:
        - name: strategyKey
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StrategyKey'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: 按评估时点和业务 ID 倒序的稳定游标页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyEvaluationPage'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      summary: 基于已存账本与市场快照生成评估
      security:
        - bearerAuth: []
      parameters:
        - name: strategyKey
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StrategyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyEvaluationRequest'
      responses:
        '200':
          description: 已返回或追加评估快照；DATA_STALE 和 BLOCKED 仍为正常解释性结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyEvaluation'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    LedgerSnapshotId:
      name: ledgerSnapshotId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
  responses:
    Problem:
      description: RFC 7807 风格错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    LoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 256
        bootstrapEnrollmentSecret:
          type: string
          maxLength: 512
    LoginResponse:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    MeResponse:
      type: object
      required: [userId, role, sessionExpiresAt]
      properties:
        userId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        role:
          type: string
          enum: [ADMIN]
        sessionExpiresAt:
          type: string
          format: date-time
    User:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        role:
          type: string
          enum: [ADMIN]
    StrategyKey:
      type: string
      enum: [HIGH_DIVIDEND, QQQ_GROWTH, IC_IM, DEEP_PUT]
    StrategyCard:
      type: object
      required: [strategyKey, displayName, currency, status, message]
      properties:
        strategyKey:
          $ref: '#/components/schemas/StrategyKey'
        displayName:
          type: string
        currency:
          type: string
          enum: [CNY, USD]
        activeRuleVersionId:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        inputAt:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [IN_RANGE, WATCH, BLOCKED, DATA_STALE, CROSS_CURRENCY_UNVALUED]
        message:
          type: string
    StrategyListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/StrategyCard'
    StrategyWorkspaceResponse:
      type: object
      required: [strategy, availableActions, activeRule, latestEvaluation]
      properties:
        strategy:
          $ref: '#/components/schemas/StrategyCard'
        availableActions:
          type: array
          items:
            type: string
        activeRule:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/StrategyRuleVersionHistory'
        latestEvaluation:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/StrategyEvaluation'
    StrategyRuleVersionCreate:
      type: object
      required: [ruleVersion, rule]
      properties:
        ruleVersion:
          type: string
          minLength: 1
          maxLength: 64
        expectedActiveRuleVersionId:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        rule:
          type: object
          description: 所有金额必须是 *_cent 十进制字符串并带显式同前缀 currency 字段。
          additionalProperties: true
    StrategyRuleVersionCreated:
      type: object
      required: [strategyRuleVersionId, strategyKey, ruleVersion, status, createdAt]
      properties:
        strategyRuleVersionId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        strategyKey:
          $ref: '#/components/schemas/StrategyKey'
        ruleVersion:
          type: string
        status:
          type: string
          enum: [ACTIVE]
        createdAt:
          type: string
          format: date-time
    StrategyRuleVersionHistory:
      type: object
      required: [strategyRuleVersionId, strategyKey, ruleVersion, rule, status, createdAt]
      properties:
        strategyRuleVersionId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        strategyKey:
          $ref: '#/components/schemas/StrategyKey'
        ruleVersion:
          type: string
        rule:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        createdAt:
          type: string
          format: date-time
    RuleVersionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StrategyRuleVersionHistory'
        nextCursor:
          type: [string, 'null']
    ReferenceNavCreate:
      type: object
      required: [referenceNavCent, currency, asOfAt, validUntil]
      properties:
        referenceNavCent:
          type: string
          pattern: '^[1-9][0-9]*$'
        currency:
          type: string
          enum: [USD]
        asOfAt:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
    ReferenceNav:
      type: object
      required: [strategyReferenceNavId, strategyKey, currency, referenceNavCent, asOfAt, validUntil, source]
      properties:
        strategyReferenceNavId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        strategyKey:
          $ref: '#/components/schemas/StrategyKey'
        currency:
          type: string
          enum: [USD]
        referenceNavCent:
          type: string
          pattern: '^[1-9][0-9]*$'
        asOfAt:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        source:
          type: string
          enum: [MANUAL]
    ReferenceNavPage:
      type: object
      required: [items]
      properties:
        items:
