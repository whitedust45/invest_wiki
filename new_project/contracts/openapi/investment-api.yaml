      properties:
        reversalTransactionIds:
          type: array
          items:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        replacementTransactionIds:
          type: array
          items:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        correctionRootTransactionIds:
          type: array
          items:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        ledgerVersion:
          type: string
          pattern: '^[1-9][0-9]*$'
    LedgerTransactionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedgerTransactionSummary'
        nextCursor:
          type: [string, 'null']
    LedgerTransactionSummary:
      type: object
      required: [transactionId, transactionType, occurredOn, currency, ledgerVersion, sourceType]
      properties:
        transactionId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        transactionType:
          type: string
          enum: [EXTERNAL_FUNDING, EXTERNAL_WITHDRAWAL, INTERNAL_TRANSFER, FEE, TRADE_BUY, TRADE_SELL, DIVIDEND, INTEREST, CORPORATE_ACTION, FUTURES_MARGIN, FUTURES_OPEN, FUTURES_CLOSE, FUTURES_DAILY_SETTLEMENT, OPTION_OPEN, OPTION_CLOSE, OPTION_EXPIRE]
        occurredOn:
          type: string
          format: date
        currency:
          type: [string, 'null']
          enum: [CNY, USD, null]
        ledgerVersion:
          type: string
          pattern: '^[1-9][0-9]*$'
        sourceType:
          type: string
          enum: [MANUAL, IMPORT, CORRECTION_REVERSAL, CORRECTION_REPLACEMENT]
        importExportFileId:
          type: [string, 'null']
          description: IMPORT 流水关联的不可变证据文件业务 ID；其他来源为 null。
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    SpotTransactionPreview:
      type: object
      required: [draftHash, currency, postings, tradeDetails, accountProvisioning, validationWarnings]
      properties:
        draftHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        currency:
          type: [string, 'null']
          enum: [CNY, USD, null]
        postings:
          type: array
          items:
            $ref: '#/components/schemas/PreviewPosting'
        tradeDetails:
          type: array
          items:
            $ref: '#/components/schemas/PreviewTradeDetail'
        accountProvisioning:
          type: array
