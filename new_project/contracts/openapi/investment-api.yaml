      properties:
        jobId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        importPreviewId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        importExportFileId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        format:
          type: string
          enum: [LEGACY_DASHBOARD_JSON, LEGACY_SQLITE]
        sourceSnapshotId:
          type: [string, 'null']
        previewChecksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
        status:
          type: string
          enum: [SUCCEEDED, FAILED, NEEDS_REVIEW, COMMITTED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
        applicableCount:
          type: integer
          minimum: 0
        needsReviewCount:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LegacyImportPreviewLine'
