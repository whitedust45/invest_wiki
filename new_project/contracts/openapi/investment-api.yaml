          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        direction:
          type: string
          enum: [IMPORT, RECONCILIATION_EVIDENCE]
        mediaType:
          type: string
        byteSize:
          type: string
          pattern: '^[1-9][0-9]*$'
        status:
          type: string
          enum: [UPLOAD_PENDING, QUARANTINED, SCANNED, PREVIEWED, COMMITTED, DELETED, FAILED]
