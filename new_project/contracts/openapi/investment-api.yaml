      type: object
      required: [sourceRow, status]
      properties:
        sourceRow:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [APPLICABLE, NEEDS_REVIEW, SKIPPED, FAILED]
        code:
          type: [string, 'null']
        operation:
          type: [string, 'null']
          enum: [EXTERNAL_FUNDING, EXTERNAL_WITHDRAWAL, SPOT_BUY, SPOT_SELL, DIVIDEND, INTEREST, OPTION_OPEN,
                 OPTION_CLOSE, OPTION_EXPIRE_ALL, FUTURES_MARGIN_IN, FUTURES_OPEN, FUTURES_CLOSE, FEE, null]
        occurredOn:
          type: [string, 'null']
          format: date
        cashAccountId:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        instrumentId:
          type: [string, 'null']
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        quantity:
          type: [string, 'null']
        unitPriceCent:
          type: [string, 'null']
          pattern: '^[1-9][0-9]*$'
        pricePoints:
          type: [string, 'null']
        amountCent:
          type: [string, 'null']
          pattern: '^(?:0|[1-9][0-9]*)$'
        initialMarginCent:
          type: [string, 'null']
          pattern: '^[1-9][0-9]*$'
        feeCent:
          type: [string, 'null']
          pattern: '^(?:0|[1-9][0-9]*)$'
        entitlementDate:
          type: [string, 'null']
          format: date
        note:
          type: [string, 'null']
          maxLength: 1000
