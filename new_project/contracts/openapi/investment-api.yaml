      type: object
      required: [importExportFileId, format]
      properties:
        importExportFileId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        format:
          type: string
          enum: [LEGACY_DASHBOARD_JSON, LEGACY_SQLITE]
