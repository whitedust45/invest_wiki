      type: object
      required: [module, symbol, instrumentId]
      properties:
        module:
          type: string
        symbol:
          type: string
        instrumentId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    LegacyDividendEntitlementOverride:
      type: object
      required: [sourceRow, entitlementDate]
      properties:
        sourceRow:
          type: integer
          minimum: 1
        entitlementDate:
          type: string
          format: date
    LegacyOptionExpiryAttestation:
      type: object
      required: [sourceRow, expiryOutcome]
      properties:
        sourceRow:
          type: integer
          minimum: 1
        expiryOutcome:
          type: string
          enum: [WORTHLESS]
