      properties:
        marketSourceEventId: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        instrumentId: {type: [string, 'null'], pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
        symbol: {type: [string, 'null']}
        sourceName: {type: [string, 'null']}
        eventType: {type: string}
        severity: {type: string}
        errorCode: {type: [string, 'null']}
        errorSummary: {type: string}
        createdAt: {type: string, format: date-time}
    UploadRequest:
      type: object
      required: [direction, mediaType, byteSize, sha256]
      properties:
        direction:
          type: string
          enum: [IMPORT, RECONCILIATION_EVIDENCE]
        mediaType:
          type: string
          enum: [application/json, application/x-sqlite3, application/pdf, image/jpeg, image/png]
        byteSize:
          type: string
          description: 文件字节数；服务端本地默认上限为 10485760，且会在扫描阶段重新校验。
          pattern: '^[1-9][0-9]*$'
        sha256:
          type: string
          description: 小写或大写的 64 位 SHA-256 十六进制摘要；服务端将标准化为小写。
          pattern: '^[a-fA-F0-9]{64}$'
    UploadRequestResponse:
      type: object
      required: [importExportFileId, uploadUrl, method, fileField, formData, expiresAt]
      properties:
        importExportFileId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          enum: [POST]
        fileField:
          type: string
          enum: [file]
        formData:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    FileScanRequestResponse:
      type: object
      required: [importExportFileId, status]
      properties:
        importExportFileId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        status:
          type: string
          enum: [QUARANTINED]
