          type: array
          items:
            $ref: '#/components/schemas/LegacyCurrencyMapping'
        instrumentMappings:
          type: array
          items:
            $ref: '#/components/schemas/LegacyInstrumentMapping'
        dividendEntitlementOverrides:
          type: array
          items:
            $ref: '#/components/schemas/LegacyDividendEntitlementOverride'
        optionExpiryAttestations:
          type: array
          items:
            $ref: '#/components/schemas/LegacyOptionExpiryAttestation'
    LegacyCurrencyMapping:
      type: object
      required: [module, currency, amountUnit, cashAccountId]
      properties:
        module:
          type: string
        action:
          type: [string, 'null']
          description: 为空时匹配该 module 的所有 action；同 module/action 不得重复。
        currency:
          type: string
          enum: [CNY, USD]
        amountUnit:
          type: string
          description: 适用于 amount、margin 与 fee；price 始终按原币种小数精确乘以 100。
          enum: [LEGACY_CNY_WAN, ORIGINAL_CURRENCY_DECIMAL]
        cashAccountId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
