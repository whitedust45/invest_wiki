<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人混合杠铃投资账本</title>
    <link rel="stylesheet" href="./styles.css?v=20260626-auto-icim" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">个人专属</p>
          <h1 id="pageTitle">总览</h1>
        </div>
        <div class="header-actions">
          <button id="saveSnapshot" type="button">重算今日</button>
          <button id="syncCloudData" type="button">云同步</button>
          <button id="exportAllData" type="button">导出全部</button>
          <label class="file-button">导入全部<input id="importAllDataFile" type="file" accept="application/json,.json" /></label>
          <button id="loadSample" type="button">示例</button>
          <button id="resetData" type="button">清空</button>
        </div>
      </header>

      <main id="appRoot" class="app-main" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-tab="overview">
          <span class="nav-icon nav-icon-overview"></span>
          <span>总览</span>
        </button>
        <button class="nav-item" type="button" data-tab="dividend">
          <span class="nav-icon nav-icon-dividend"></span>
          <span>高分红</span>
        </button>
        <button class="nav-item" type="button" data-tab="qqq">
          <span class="nav-icon nav-icon-qqq"></span>
          <span>QQQ</span>
        </button>
        <button class="nav-item" type="button" data-tab="put">
          <span class="nav-icon nav-icon-put"></span>
          <span>深度Put</span>
        </button>
        <button class="nav-item" type="button" data-tab="ic">
          <span class="nav-icon nav-icon-ic"></span>
          <span>IC/IM</span>
        </button>
        <button class="nav-item" type="button" data-tab="reports">
          <span class="nav-icon nav-icon-reports"></span>
          <span>报表</span>
        </button>
      </nav>
    </div>

    <script src="./app.js?v=20260626-auto-icim"></script>
  </body>
</html>
