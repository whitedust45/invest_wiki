<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人混合杠铃投资账本 - 桌面版</title>
    <link rel="stylesheet" href="./styles.css?v=20260626-auto-icim" />
    <link rel="stylesheet" href="./styles.desktop.css?v=20260626-desktop-layout" />
  </head>
  <body class="desktop-browser">
    <div class="app-shell desktop-shell">
      <aside class="desktop-sidebar">
        <div class="desktop-brand">
          <p class="eyebrow">个人专属</p>
          <strong>混合杠铃账本</strong>
          <small>桌面工作台入口，保留原手机页面不动。</small>
        </div>

        <nav class="desktop-nav" aria-label="桌面主导航">
          <div class="desktop-nav-group is-open" data-nav-group="overview">
            <button class="nav-item is-active" type="button" data-tab="overview" data-subpage="full">
              <span class="nav-icon nav-icon-overview"></span>
              <span>总览</span>
              <span class="desktop-nav-chevron">›</span>
            </button>
            <div class="desktop-subnav">
              <button class="desktop-subitem is-active" type="button" data-tab="overview" data-subpage="full">全部总览</button>
              <button class="desktop-subitem" type="button" data-tab="overview" data-subpage="snapshot">净值快照</button>
              <button class="desktop-subitem" type="button" data-tab="overview" data-subpage="risk">账户风险</button>
              <button class="desktop-subitem" type="button" data-tab="overview" data-subpage="settings">核心参数</button>
              <button class="desktop-subitem" type="button" data-tab="overview" data-subpage="charts">图表追踪</button>
              <button class="desktop-subitem" type="button" data-tab="overview" data-subpage="actions">缺口动作</button>
            </div>
          </div>

          <div class="desktop-nav-group" data-nav-group="dividend">
            <button class="nav-item" type="button" data-tab="dividend" data-subpage="overview">
              <span class="nav-icon nav-icon-dividend"></span>
              <span>高分红</span>
              <span class="desktop-nav-chevron">›</span>
            </button>
            <div class="desktop-subnav">
              <button class="desktop-subitem" type="button" data-tab="dividend" data-subpage="full">全部总览</button>
              <button class="desktop-subitem" type="button" data-tab="dividend" data-subpage="overview">模块概览</button>
              <button class="desktop-subitem" type="button" data-tab="dividend" data-subpage="entry">记录录入</button>
              <button class="desktop-subitem" type="button" data-tab="dividend" data-subpage="buckets">持仓分布</button>
              <button class="desktop-subitem" type="button" data-tab="dividend" data-subpage="valuation">持仓估值</button>
              <button class="desktop-subitem" type="button" data-tab="dividend" data-subpage="ledger">投资流水</button>
            </div>
          </div>

          <div class="desktop-nav-group" data-nav-group="qqq">
            <button class="nav-item" type="button" data-tab="qqq" data-subpage="overview">
              <span class="nav-icon nav-icon-qqq"></span>
              <span>QQQ</span>
              <span class="desktop-nav-chevron">›</span>
            </button>
            <div class="desktop-subnav">
              <button class="desktop-subitem" type="button" data-tab="qqq" data-subpage="full">全部总览</button>
              <button class="desktop-subitem" type="button" data-tab="qqq" data-subpage="overview">模块概览</button>
              <button class="desktop-subitem" type="button" data-tab="qqq" data-subpage="entry">记录录入</button>
              <button class="desktop-subitem" type="button" data-tab="qqq" data-subpage="buckets">持仓分布</button>
              <button class="desktop-subitem" type="button" data-tab="qqq" data-subpage="valuation">持仓估值</button>
              <button class="desktop-subitem" type="button" data-tab="qqq" data-subpage="ledger">投资流水</button>
            </div>
          </div>

          <div class="desktop-nav-group" data-nav-group="put">
            <button class="nav-item" type="button" data-tab="put" data-subpage="overview">
              <span class="nav-icon nav-icon-put"></span>
              <span>深度 Put</span>
              <span class="desktop-nav-chevron">›</span>
            </button>
            <div class="desktop-subnav">
              <button class="desktop-subitem" type="button" data-tab="put" data-subpage="full">全部总览</button>
              <button class="desktop-subitem" type="button" data-tab="put" data-subpage="overview">模块概览</button>
              <button class="desktop-subitem" type="button" data-tab="put" data-subpage="entry">记录录入</button>
              <button class="desktop-subitem" type="button" data-tab="put" data-subpage="buckets">持仓分布</button>
              <button class="desktop-subitem" type="button" data-tab="put" data-subpage="valuation">持仓估值</button>
              <button class="desktop-subitem" type="button" data-tab="put" data-subpage="ledger">投资流水</button>
            </div>
          </div>

          <div class="desktop-nav-group" data-nav-group="ic">
            <button class="nav-item" type="button" data-tab="ic" data-subpage="overview">
              <span class="nav-icon nav-icon-ic"></span>
              <span>IC / IM</span>
              <span class="desktop-nav-chevron">›</span>
            </button>
            <div class="desktop-subnav">
              <button class="desktop-subitem" type="button" data-tab="ic" data-subpage="full">全部总览</button>
              <button class="desktop-subitem" type="button" data-tab="ic" data-subpage="overview">模块概览</button>
              <button class="desktop-subitem" type="button" data-tab="ic" data-subpage="entry">记录录入</button>
              <button class="desktop-subitem" type="button" data-tab="ic" data-subpage="buckets">持仓分布</button>
              <button class="desktop-subitem" type="button" data-tab="ic" data-subpage="valuation">持仓估值</button>
              <button class="desktop-subitem" type="button" data-tab="ic" data-subpage="ledger">投资流水</button>
            </div>
          </div>

          <div class="desktop-nav-group" data-nav-group="reports">
            <button class="nav-item" type="button" data-tab="reports" data-subpage="charts">
              <span class="nav-icon nav-icon-reports"></span>
              <span>报表</span>
              <span class="desktop-nav-chevron">›</span>
            </button>
            <div class="desktop-subnav">
              <button class="desktop-subitem" type="button" data-tab="reports" data-subpage="full">全部总览</button>
              <button class="desktop-subitem" type="button" data-tab="reports" data-subpage="charts">图表总览</button>
              <button class="desktop-subitem" type="button" data-tab="reports" data-subpage="matrix">策略矩阵</button>
              <button class="desktop-subitem" type="button" data-tab="reports" data-subpage="leaderboard">标的排行</button>
              <button class="desktop-subitem" type="button" data-tab="reports" data-subpage="valuation">估值总表</button>
              <button class="desktop-subitem" type="button" data-tab="reports" data-subpage="activity">最近流水</button>
            </div>
          </div>
        </nav>

      </aside>

      <div class="desktop-main-shell">
        <header class="app-header desktop-header">
          <div>
            <p class="eyebrow">桌面工作台</p>
            <h1 id="pageTitle">总览</h1>
          </div>
          <div class="header-actions">
            <button id="saveSnapshot" type="button">重算今日</button>
            <button id="syncCloudData" type="button">云同步</button>
            <button id="exportAllData" type="button">导出全部</button>
            <label class="file-button">导入全部<input id="importAllDataFile" type="file" accept="application/json,.json" /></label>
            <button id="loadSample" type="button">示例</button>
            <button id="resetData" type="button">清空</button>
          </div>
        </header>

        <main id="appRoot" class="app-main" aria-live="polite"></main>
      </div>
    </div>

    <script src="./app.js?v=20260626-auto-icim"></script>
  </body>
</html>
